# Copy to config.yaml (or run `jarvis init`) and make it yours.

owner_name: "Boss"            # what Jarvis calls you
brand_name: "My Brand"
brand_description: >
  A creator sharing practical tips about building things, productivity and tech.
brand_voice: >
  Confident, witty, helpful. Short punchy sentences. No corporate jargon.
  Light humor is welcome; never mean-spirited.
audience: "Indie makers, developers and curious people who like to learn."
topics:
  - productivity tips
  - AI tools
  - behind-the-scenes of building products
avoid:                         # topics/words Jarvis must never post about
  - politics
  - religion
  - competitor names
hashtags_style: "0-2 relevant hashtags, never hashtag spam"

# review    -> Jarvis drafts everything, you approve before anything goes public (recommended to start)
# autopilot -> Jarvis publishes and replies on its own, within the limits below
mode: review

# true = never touch real accounts; posts are "published" to the log only. Turn off when ready.
dry_run: true

timezone: "America/New_York"

model: "claude-opus-5-5"
effort: "high"                 # low | medium | high | xhigh | max

platforms:
  x:         { enabled: false, posts_per_day: 3 }
  bluesky:   { enabled: false, posts_per_day: 2 }
  mastodon:  { enabled: false, posts_per_day: 2 }
  facebook:  { enabled: false, posts_per_day: 1 }
  instagram: { enabled: false, posts_per_day: 1 }   # Instagram posts require an image URL
  youtube:   { enabled: false, posts_per_day: 1 }   # uploads per day; run `jarvis youtube-auth` once

youtube:
  inbox_dir: "videos"          # drop files in videos/long/ or videos/shorts/ (+ optional notes .txt)
  privacy: "public"            # public | unlisted | private
  category_id: "22"            # 22 = People & Blogs, 28 = Science & Tech, 24 = Entertainment, 27 = Education

# Markets section: research, scam checks, alerts and PAPER trading (simulated money at real prices).
# Jarvis never places real orders. Most memecoins go to zero - use the track record to judge strategies.
trading:
  enabled: true
  crypto_exchange: "kraken"    # where crypto prices come from (kraken, coinbase, binanceus, ...)
  paper_starting_cash: 1000
  max_usd_per_trade: 50
  max_daily_loss_usd: 100      # no new buys once today's losses hit this
  max_open_positions: 5
  max_memecoin_exposure_usd: 200
  default_stop_loss_pct: 15
  default_take_profit_pct: 40
  memecoin_chains: [solana, ethereum, base]
  min_liquidity_usd: 50000     # ignore tokens with less liquidity than this
  watchlist: ["BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD", "AAPL", "TSLA", "NVDA"]  # stocks need Alpaca keys
  alert_move_pct: 5            # ping you when a watchlist asset moves this much
  watch_every_minutes: 15
  memecoin_scan_every_minutes: 60
  auto_paper_trade: true       # let Jarvis paper-trade on his own to build a track record

schedule:
  plan_content_at: "07:00"     # daily content planning session
  posting_times: ["09:00", "13:00", "18:30"]
  check_mentions_every_minutes: 15
  refresh_metrics_every_minutes: 60
  daily_briefing_at: "21:00"

engagement:
  auto_reply: true             # reply to mentions/comments (still needs approval in review mode)
  max_replies_per_run: 10

db_path: "data/jarvis.db"
